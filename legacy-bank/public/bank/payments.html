<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支付宝沙箱 · 付款与订单</title><link rel="stylesheet" href="/bank/payments.css"></head><body><main><header><a href="/bank/">← 返回个人银行</a><span class="badge">支付宝沙箱</span></header><section class="hero"><p>PAYMENT LAB</p><h1>付款、查单与退款</h1><p>使用支付宝测试买家完成沙箱付款，订单与银行卡余额独立。这里不销售商品，不提供真实充值。</p><strong>每笔测试金额 ¥1.00</strong><p>请只使用沙箱买家和沙箱钱包，勿使用真实支付宝扫码付款。付款后返回本页点击“查询状态”。</p><button id="create">创建沙箱付款订单</button><button id="refresh" class="secondary">刷新订单列表</button></section><button id="enter" hidden>进入独立测试模式</button><p id="message" role="status" aria-live="polite"></p><section id="orders" aria-label="订单记录"></section><footer>离开测试模式后无法访问这些订单。若未完成退款，请保留当前浏览器测试会话。退款只退回原沙箱付款账户。</footer></main><dialog id="review"><form method="dialog"><h2 id="review-title"></h2><p id="review-text"></p><div class="actions"><button value="cancel" class="secondary">返回</button><button id="approve" value="confirm">确认</button></div></form></dialog><script type="module" src="/bank/payments.js"></script></body></html>
